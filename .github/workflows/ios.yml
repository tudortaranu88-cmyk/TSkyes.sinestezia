name: iOS (compilare simulator)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Instalare dependențe JS
        run: npm install --no-audit --no-fund

      - name: Aliniere versiuni cu SDK-ul Expo
        run: npx expo install --fix

      - name: Verificare tipuri și teste core
        run: |
          npx tsc --noEmit
          npm test

      - name: Expo prebuild (iOS)
        run: npx expo prebuild --platform ios --no-install --clean

      - name: Pods
        working-directory: ios
        run: pod install

      - name: Compilare pentru iPhone (Release, fără semnare)
        working-directory: ios
        shell: bash -o pipefail {0}
        run: |
          # Schema aplicației are același nume ca proiectul ei (nu schemele pentru module, ex. AacEncoder)
          PROJ=$(ls -d *.xcodeproj | head -1)
          SCHEME="${PROJ%.xcodeproj}"
          WS=$(ls -d *.xcworkspace | head -1)
          echo "Proiect: $PROJ · schemă: $SCHEME"
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -80

      - name: Împachetare .ipa (nesemnat)
        run: |
          APP=$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "App: $APP"
          rm -rf ipa && mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          cd ipa && zip -qr ../MusicColor-unsigned.ipa Payload
          ls -la ../MusicColor-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: music-and-color-iphone
          path: MusicColor-unsigned.ipa

      - name: Publicare .ipa pe ramura build-output-iphone
        if: success()
        run: |
          set -e
          out=$(mktemp -d)
          cp MusicColor-unsigned.ipa "$out/"
          echo "run ${{ github.run_number }} · ${{ github.sha }} · iPhone (nesemnat, de instalat cu Sideloadly)" > "$out/STATUS.txt"
          cd "$out"
          git init -q -b build-output-iphone
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "iPhone ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-output-iphone
