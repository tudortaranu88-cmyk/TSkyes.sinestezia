name: Diagnostic autolinking
on: workflow_dispatch
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund > /dev/null 2>&1; mkdir -p d
      - run: |
          {
            echo "== ls node_modules/aac-encoder"; ls -la node_modules/aac-encoder node_modules/aac-encoder/ 2>&1
            echo "== autolinking version"; cat node_modules/expo-modules-autolinking/package.json | grep '"version"'
            echo "== search"; npx expo-modules-autolinking search --platform android 2>&1 | grep -iE -A8 "aac" 
            echo "== verbose resolve"; npx expo-modules-autolinking resolve --platform android --json 2>&1 | grep -o '"packageName":"[^"]*"'
            echo "== grep sources"; grep -rnE "nativeModulesDir|expo-module.config.json|isSymbolicLink|realpath" node_modules/expo-modules-autolinking/build --include=*.js | head -60
          } > d/diag.txt 2>&1
          ls node_modules/expo-modules-autolinking/build > d/files.txt
          cp -r node_modules/expo-modules-autolinking/build d/build
      - run: |
          cd d && git init -q -b diag-output && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add -A && git commit -qm diag && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" diag-output
