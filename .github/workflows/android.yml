name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Instalare dependențe
        run: npm install --no-audit --no-fund

      - name: Aliniere versiuni cu SDK-ul Expo
        run: npx expo install --fix

      - name: Verificare tipuri
        run: npx tsc --noEmit

      - name: Teste core
        run: npm test

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --no-install --clean

      - name: Compilare APK (release, semnat cu cheia debug)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Redenumire APK
        run: cp android/app/build/outputs/apk/release/app-release.apk sinestezia-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sinestezia-apk
          path: sinestezia-*.apk
          if-no-files-found: error
