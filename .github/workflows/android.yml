name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    defaults:
      run:
        shell: bash -o pipefail {0}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - run: mkdir -p ci-logs

      - name: Instalare dependențe
        run: npm install --no-audit --no-fund 2>&1 | tee ci-logs/1-npm-install.txt

      - name: Aliniere versiuni cu SDK-ul Expo
        run: npx expo install --fix 2>&1 | tee ci-logs/2-expo-fix.txt

      - name: Module native găsite de autolinking
        run: npx expo-modules-autolinking resolve --platform android 2>&1 | tee ci-logs/2b-autolinking.txt | grep -iE "aac|error" || true

      - name: Verificare tipuri
        run: npx tsc --noEmit 2>&1 | tee ci-logs/3-tsc.txt

      - name: Teste core
        run: npm test 2>&1 | tee ci-logs/4-test.txt

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --no-install --clean 2>&1 | tee ci-logs/5-prebuild.txt

      - name: Compilare APK (release, semnat cu cheia debug)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a 2>&1 | tee ../ci-logs/6-gradle.txt

      - name: Redenumire APK
        run: cp android/app/build/outputs/apk/release/app-release.apk sinestezia-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v5
        with:
          name: sinestezia-apk
          path: sinestezia-*.apk
          if-no-files-found: error

      # Publică APK-ul (și logurile) pe ramura `build-output`, ca să poată fi luate și prin git.
      - name: Publicare pe ramura build-output
        if: always()
        run: |
          set +e
          out=$(mktemp -d)
          cp -r ci-logs "$out/" 2>/dev/null
          cp sinestezia-*.apk "$out/" 2>/dev/null
          npm ls --depth=0 > "$out/ci-logs/0-versiuni.txt" 2>&1
          echo "run ${{ github.run_number }} · ${{ github.sha }} · ${{ job.status }}" > "$out/STATUS.txt"
          cd "$out"
          git init -q -b build-output
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Build ${{ github.run_number }} (${{ job.status }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-output
